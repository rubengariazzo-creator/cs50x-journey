name: Notify portfolio site

on:
  push:
    branches: [main]
    paths:
      - progress.json

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio rebuild
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rubengariazzo-creator/rubengariazzo-creator.github.io/dispatches \
            -d '{"event_type":"cs50x-updated"}'
